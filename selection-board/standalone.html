  <style>
/* board.css — 选品立项 PPT 看板主题 */
:root {
  --bg: #1d1810;
  --stage: #262017;
  --panel: #ffffff;
  --ink: #2a2318;
  --muted: #7b7060;
  --line: #ece3d3;
  --line-2: #f3ecdf;
  --gold: #c8861a;
  --gold-strong: #a4760f;
  --gold-soft: #fbf3e2;
  --blue: #2b6cb0;
  --green: #3f9b6b;
  --red: #b5546a;
  --good-bg: #e9f5ea; --good-ink: #1e6b34;
  --bad-bg: #fdeaea; --bad-ink: #a32424;
  --warn-bg: #fff4e0; --warn-ink: #8a5a00;
  --radius: 14px;
  --shadow: 0 8px 30px rgba(0, 0, 0, .28);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Arial, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ───────── 顶栏 ───────── */
.tb {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 10px 18px; background: #171209; color: #f5ecdb;
  border-bottom: 1px solid #3a2f1d; flex-wrap: wrap;
}
.tb-brand { display: flex; align-items: center; gap: 12px; }
.tb-mark {
  width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--gold), var(--gold-strong)); font-size: 20px;
}
.tb-title { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: .3px; }
.tb-sub { margin: 0; font-size: 12px; color: #b7a988; }
.tb-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: #261d10; border: 1px solid #3a2f1d; border-radius: 10px; padding: 3px; }
.seg-btn {
  border: 0; background: transparent; color: #c9bda4; font-size: 13px; font-weight: 600;
  padding: 7px 14px; border-radius: 8px; cursor: pointer;
}
.seg-btn.is-on { background: var(--gold); color: #1d1207; }
.tb-btn {
  border: 1px solid #3a2f1d; background: #261d10; color: #f0e6d3; font-size: 13px; font-weight: 600;
  padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: .15s;
}
.tb-btn:hover { background: #322615; border-color: var(--gold); }

/* ───────── 布局 ───────── */
.layout { flex: 1; min-height: 0; display: flex; }
.side {
  width: 250px; flex-shrink: 0; background: #211a11; border-right: 1px solid #352a1a;
  overflow-y: auto; padding: 10px 8px 30px; color: #d8ccb4;
}
.side-head { font-size: 12px; font-weight: 700; color: #8d7d5f; padding: 10px 10px 6px; letter-spacing: .5px; }
.side-ch { font-size: 12px; font-weight: 700; color: var(--gold); padding: 12px 10px 4px; }
.side-item {
  width: 100%; display: flex; gap: 9px; align-items: center; text-align: left;
  background: transparent; border: 0; color: #cfc3aa; padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px;
}
.side-item:hover { background: #2c2214; }
.side-item.is-cur { background: var(--gold-soft); color: #5a3e08; font-weight: 600; }
.side-no { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; background: #322615; color: #b8a784; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.side-item.is-cur .side-no { background: var(--gold); color: #fff; }
.side-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.stage { flex: 1; min-width: 0; overflow-y: auto; background: var(--stage); }

/* ───────── 幻灯片画布（固定 1280×720，JS 缩放） ───────── */
.slide-frame { width: 100%; overflow: hidden; }
.slide-canvas {
  width: 1280px; height: 720px; transform-origin: top left; background: var(--panel);
  padding: 44px 54px; position: relative; color: var(--ink);
  display: flex; flex-direction: column;
}
.slide-canvas::after {
  content: ""; position: absolute; left: 0; top: 0; width: 8px; height: 100%;
  background: linear-gradient(var(--gold), var(--gold-strong));
}

/* 幻灯片头部 */
.slide-head { margin-bottom: 18px; }
.slide-kicker { font-size: 15px; font-weight: 700; color: var(--gold-strong); letter-spacing: .5px; }
.kdot { margin-right: 4px; }
.action-title { margin: 6px 0 0; font-size: 31px; line-height: 1.25; font-weight: 800; letter-spacing: .2px; }
.slide-sub { margin: 8px 0 0; font-size: 16px; color: var(--muted); }
.blk-title { margin: 0 0 10px; font-size: 16px; font-weight: 700; }
.blk-title.good { color: var(--good-ink); } .blk-title.bad { color: var(--bad-ink); }

/* 多列 */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; flex: 1; }
.three-col { display: grid; grid-template-columns: 1.1fr .8fr 1fr; gap: 24px; align-items: start; flex: 1; }
.center-col { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }

/* KPI 卡片 */
.kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; flex: 1; align-content: center; }
.kpi-card {
  background: linear-gradient(150deg, #fffaf0, #fff); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 22px 24px; box-shadow: 0 2px 10px rgba(164,118,15,.06);
}
.kpi-label { font-size: 15px; color: var(--muted); font-weight: 600; }
.kpi-value { font-size: 40px; font-weight: 800; color: var(--gold-strong); margin-top: 6px; line-height: 1; }
.kpi-unit { font-size: 16px; color: var(--muted); margin-left: 6px; font-weight: 600; }
.kpi-sub { font-size: 13.5px; color: var(--muted); margin-top: 8px; }

/* 表格 */
.data-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.data-table.compact { font-size: 12.8px; }
.data-table th { background: #faf4e8; color: #6b5a36; font-weight: 700; text-align: left; padding: 9px 11px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.data-table td { padding: 8px 11px; border-bottom: 1px solid var(--line-2); }
.data-table.compact td, .data-table.compact th { padding: 6px 9px; }
.data-table tr:last-child td { border-bottom: 0; }
.up { color: var(--green); font-weight: 700; }
.stars { color: var(--gold); letter-spacing: 1px; }

/* 热力矩阵 */
.heat-table td.ht-cell { text-align: center; font-weight: 700; font-size: 13.5px; border: 1px solid #fff; }
.heat-table td.ht-brand { font-weight: 700; white-space: nowrap; }

/* 定义卡片 */
.def-card { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
.def-row { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--line-2); }
.def-row:last-child { border-bottom: 0; }
.def-row span { color: var(--muted); font-weight: 600; }

/* chips / 关键词 */
.chip { display: inline-block; padding: 4px 11px; border-radius: 999px; background: #f1ece0; color: #5e5340; font-size: 12.5px; font-weight: 600; margin: 0 6px 6px 0; }
.chip.good { background: var(--good-bg); color: var(--good-ink); }
.chip.muted { background: #eef1f4; color: #50617a; }
.kw-block { display: flex; gap: 12px; align-items: baseline; margin-bottom: 12px; }
.kw-tag { flex-shrink: 0; width: 66px; font-size: 13px; color: var(--muted); font-weight: 700; }

/* 决策门 */
.gate { border-radius: var(--radius); padding: 16px 18px; border: 1.5px solid; margin-top: 6px; }
.gate-ok { background: #f3faf4; border-color: #bfe3c8; }
.gate-wait { background: #fff7e8; border-color: #f0d9a8; }
.gate-top { display: flex; align-items: center; gap: 10px; }
.gate-icon { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; }
.gate-ok .gate-icon { background: var(--green); }
.gate-wait .gate-icon { background: var(--gold); }
.gate-title { font-weight: 800; font-size: 16px; }
.gate-pill { margin-left: auto; font-size: 12.5px; font-weight: 700; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.gate-ok .gate-pill { background: var(--green); color: #fff; }
.gate-wait .gate-pill { background: var(--gold); color: #fff; }
.gate-desc { margin: 8px 0 6px; font-size: 13.5px; color: var(--muted); }
.gate-value { font-size: 14.5px; }
.gate-time { color: var(--muted); font-size: 12.5px; margin-left: 8px; }

/* 工作流总览 */
.flow { display: flex; align-items: stretch; gap: 4px; flex-wrap: wrap; justify-content: center; flex: 1; align-content: center; }
.flow-node { width: 116px; background: #fffaf0; border: 1px solid var(--line); border-radius: 12px; padding: 14px 8px; text-align: center; position: relative; }
.flow-n { width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #fff; font-weight: 800; display: grid; place-items: center; margin: 0 auto 8px; font-size: 13px; }
.flow-ico { font-size: 22px; } .flow-name { font-size: 13.5px; font-weight: 700; margin-top: 4px; }
.flow-gate { font-size: 11px; color: var(--gold-strong); margin-top: 6px; font-weight: 700; }
.flow-arrow { display: grid; place-items: center; color: var(--gold); font-size: 20px; font-weight: 800; }
.note-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* 图表 */
.chart { width: 100%; height: auto; display: block; }
.chart-donut, .chart-radar { max-width: 100%; }

/* VOC */
.voc-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.voc-dim { width: 76px; font-size: 14px; font-weight: 600; flex-shrink: 0; }
.voc-track { flex: 1; height: 16px; background: #f1ece0; border-radius: 999px; overflow: hidden; }
.voc-fill { height: 100%; border-radius: 999px; }
.voc-fill.good { background: var(--green); } .voc-fill.bad { background: var(--red); }
.voc-pct { width: 40px; text-align: right; font-weight: 700; font-size: 14px; }
.voc-note { font-size: 12.5px; color: var(--muted); margin: 2px 0 0 86px; }
.callout { margin-top: 16px; background: var(--gold-soft); border-left: 4px solid var(--gold); padding: 12px 16px; border-radius: 8px; font-size: 14.5px; }
.callout.sm { font-size: 13px; padding: 10px 13px; margin-top: 12px; }

/* SWOT */
.swot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swot-q { border-radius: 12px; padding: 12px 14px; border: 1px solid; }
.swot-q b { font-size: 14px; } .swot-q ul { margin: 8px 0 0; padding-left: 18px; } .swot-q li { font-size: 13px; margin-bottom: 4px; }
.swot-q.s { background: #f1f8f2; border-color: #cce6d2; } .swot-q.w { background: #fdf2f2; border-color: #f0d2d2; }
.swot-q.o { background: #f0f5fb; border-color: #cfe0f0; } .swot-q.t { background: #fff6e9; border-color: #f0dcb4; }
.sw-line { font-size: 13px; margin-top: 7px; padding-left: 4px; }
.sw-line.good { color: var(--good-ink); } .sw-line.bad { color: var(--bad-ink); } .sw-line.tip { color: var(--gold-strong); }

/* 交叉推导 */
.cross-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; flex: 1; align-content: center; }
.cross-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; background: #fffaf0; }
.cross-combo { font-size: 24px; font-weight: 800; color: var(--gold-strong); }
.cross-mean { font-size: 14px; color: var(--muted); margin: 6px 0 12px; }
.cross-dir { font-size: 15px; line-height: 1.5; }

/* 公司卡片 */
.company-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.company-head { display: flex; align-items: center; gap: 10px; font-size: 17px; }
.company-meta { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; }
.company-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.company-kpis div { background: #faf4e8; border-radius: 8px; padding: 8px; text-align: center; }
.company-kpis b { display: block; font-size: 16px; color: var(--gold-strong); }
.company-kpis span { font-size: 11px; color: var(--muted); }

/* 洞察 */
.insight { display: flex; gap: 10px; font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
.insight-n { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }

/* 方向卡星级 / 专利 */
.patent-row { display: grid; grid-template-columns: 78px 1fr; gap: 10px; font-size: 14px; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.patent-row span { color: var(--muted); font-weight: 600; }

/* 成本 / 仪表盘 */
.cost-sum { margin-top: 12px; padding: 10px 14px; background: var(--gold-soft); border-radius: 8px; font-size: 15px; }
.cost-sum strong, .gate strong { color: var(--gold-strong); }

/* 立项九问 */
.nine-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; flex: 1; align-content: center; }
.nine-card { border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; background: #fffdf8; }
.nine-q { font-size: 14.5px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.nine-n { background: var(--gold); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 6px; }
.nine-a { font-size: 12.5px; color: var(--muted); margin: 7px 0; line-height: 1.45; }
.nine-score { font-size: 13px; color: var(--gold); letter-spacing: 1px; } .nine-score b { color: var(--ink); margin-left: 6px; }

/* 决策 */
.mini-bar { height: 12px; background: #f1ece0; border-radius: 999px; overflow: hidden; width: 100%; }
.mini-bar div { height: 100%; background: var(--gold); }
.decision-col { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.decision-badge { font-size: 64px; font-weight: 900; padding: 20px 50px; border-radius: 20px; letter-spacing: 2px; }
.decision-badge.go { background: var(--good-bg); color: var(--good-ink); border: 3px solid var(--green); }
.decision-badge.nogo { background: var(--bad-bg); color: var(--bad-ink); border: 3px solid var(--red); }
.decision-note { font-size: 14.5px; line-height: 1.6; margin-top: 18px; color: #4a4030; }

/* 可编辑字段 */
.editable { border-bottom: 1px dashed transparent; cursor: text; border-radius: 3px; padding: 0 1px; transition: .12s; }
.deck-stage .editable:hover { border-bottom-color: var(--gold); background: var(--gold-soft); }
.editable.editing { background: #fff; outline: 2px solid var(--gold); border-radius: 4px; }

/* ───────── 封面 ───────── */
.cover { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.cover-badge { align-self: flex-start; background: var(--gold-soft); color: var(--gold-strong); font-weight: 700; font-size: 15px; padding: 7px 16px; border-radius: 999px; }
.cover-title { font-size: 50px; font-weight: 900; margin: 22px 0 0; line-height: 1.2; max-width: 80%; }
.cover-meta { display: flex; gap: 36px; margin: 26px 0 30px; flex-wrap: wrap; }
.cover-meta div { font-size: 18px; font-weight: 700; }
.cover-meta span { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.cover-gates { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.cover-gates .gate { margin-top: 0; }

/* ───────── 看板视图 ───────── */
.stage-board { padding: 22px 26px 60px; }
.board-group { margin-bottom: 26px; }
.board-group-title { color: #e8dcc4; font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.board-group-title span { color: #9d8d6c; font-weight: 600; margin-left: 8px; font-size: 12.5px; }
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
.thumb { position: relative; padding: 0; border: 1px solid #3a2f1d; border-radius: 12px; overflow: hidden; cursor: pointer; background: #fff; box-shadow: var(--shadow); transition: .16s; display: block; }
.thumb:hover { transform: translateY(-3px); border-color: var(--gold); box-shadow: 0 12px 34px rgba(0,0,0,.4); }
.thumb .slide-canvas { pointer-events: none; }
.thumb-no { position: absolute; left: 8px; top: 8px; background: rgba(29,18,7,.82); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 7px; }

/* ───────── 演示视图 ───────── */
.stage-deck { display: flex; align-items: center; justify-content: center; padding: 26px; }
.deck-wrap { width: 100%; max-width: 1160px; }
.deck-stage { border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.deck-bar { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 18px; }
.nav-btn { background: #322615; color: #f0e6d3; border: 1px solid #4a3a20; padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
.nav-btn:hover:not(:disabled) { background: var(--gold); color: #1d1207; border-color: var(--gold); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.deck-count { color: #d8ccb4; font-size: 14px; font-weight: 700; min-width: 70px; text-align: center; }

/* ───────── 数据存档抽屉 ───────── */
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
.drawer { position: fixed; right: 0; top: 0; height: 100%; width: 400px; max-width: 92vw; background: #fff; z-index: 50; box-shadow: -10px 0 40px rgba(0,0,0,.3); display: flex; flex-direction: column; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.drawer-head h3 { margin: 0; font-size: 17px; }
.icon-btn { border: 0; background: #f1ece0; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 15px; }
.drawer-body { padding: 18px 20px 40px; overflow-y: auto; }
.dw-sec { margin-bottom: 26px; }
.dw-sec h4 { margin: 0 0 10px; font-size: 14px; color: #6b5a36; }
.dw-count { background: var(--gold); color: #fff; font-size: 12px; padding: 1px 8px; border-radius: 999px; margin-left: 4px; }
.dw-input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 14px; margin-bottom: 9px; }
.dw-input:focus { outline: 2px solid var(--gold); border-color: transparent; }
.dw-hint, .dw-empty { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
.dw-empty { text-align: center; padding: 18px; background: #faf7f0; border-radius: 10px; }
.dw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.btn-primary { width: 100%; background: var(--gold); color: #1d1207; border: 0; padding: 11px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-primary:hover { background: var(--gold-strong); color: #fff; }
.btn-ghost { background: #faf7f0; border: 1px solid var(--line); color: var(--ink); padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
.btn-ghost:hover { border-color: var(--gold); }
.btn-ghost.danger { color: var(--bad-ink); } .btn-ghost.danger:hover { border-color: var(--red); background: var(--bad-bg); }

.ar-list { display: flex; flex-direction: column; gap: 9px; }
.ar-item { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; }
.ar-main { flex: 1; min-width: 0; }
.ar-name { font-weight: 700; font-size: 14px; }
.ar-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ar-acts { display: flex; gap: 5px; }
.mini { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
.mini:hover { border-color: var(--gold); background: var(--gold-soft); }
.mini.danger:hover { border-color: var(--red); background: var(--bad-bg); }

/* ───────── Toast ───────── */
.toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(10px); background: #1d1207; color: #fff; padding: 11px 22px; border-radius: 999px; font-size: 13.5px; font-weight: 600; z-index: 60; opacity: 0; transition: .25s; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ───────── 打印 / PDF ───────── */
.print-root { display: none; }
@media print {
  @page { size: 1280px 720px; margin: 0; }
  body.printing > *:not(.print-root) { display: none !important; }

/* ===== js/charts.js ===== */
// charts.js — 纯 SVG 图表引擎（无第三方依赖，离线可用）
// 所有函数返回 SVG 字符串，由 slides.js 注入到幻灯片中。

const PALETTE = ['#c8861a', '#2b6cb0', '#3f9b6b', '#b5546a', '#7b6cc0', '#d98841', '#5a9bd4'];
const GRID = '#ece3d3';
const AXIS = '#9a8e78';
const INK = '#2a2318';

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const num = (v) => (Number.isFinite(+v) ? +v : 0);

function svgWrap(w, h, inner, cls = '') {
  return `<svg class="chart ${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${inner}</svg>`;
}

/* ───────── 折线图（月度趋势） ───────── */
function lineChart(data, opts = {}) {
  const w = 760, h = 320, pad = { t: 24, r: 24, b: 46, l: 56 };
  const pts = data.map((d) => ({ label: d.label, value: num(d.value) }));
  if (!pts.length) return svgWrap(w, h, '');
  const max = Math.max(...pts.map((p) => p.value)) * 1.12;
  const min = Math.min(0, ...pts.map((p) => p.value));
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const x = (i) => pad.l + (pts.length === 1 ? iw / 2 : (i / (pts.length - 1)) * iw);
  const y = (v) => pad.t + ih - ((v - min) / (max - min || 1)) * ih;

  let g = '';
  // 网格 + Y 轴刻度
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = min + ((max - min) / ticks) * i;
    const yy = y(v);
    g += `<line x1="${pad.l}" y1="${yy}" x2="${w - pad.r}" y2="${yy}" stroke="${GRID}" stroke-width="1"/>`;
    g += `<text x="${pad.l - 10}" y="${yy + 4}" text-anchor="end" font-size="12" fill="${AXIS}">${Math.round(v)}</text>`;
  }
  // 面积 + 折线
  const line = pts.map((p, i) => `${x(i)},${y(p.value)}`).join(' ');
  const area = `${pad.l},${y(min)} ${line} ${x(pts.length - 1)},${y(min)}`;
  g += `<polygon points="${area}" fill="${PALETTE[0]}" opacity="0.10"/>`;
  g += `<polyline points="${line}" fill="none" stroke="${PALETTE[0]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  // 数据点 + X 轴标签
  pts.forEach((p, i) => {
    g += `<circle cx="${x(i)}" cy="${y(p.value)}" r="4" fill="#fff" stroke="${PALETTE[0]}" stroke-width="2.5"/>`;
    const lbl = esc(p.label).replace(/^\d{4}-/, '');
    g += `<text x="${x(i)}" y="${h - pad.b + 20}" text-anchor="middle" font-size="11" fill="${AXIS}">${lbl}</text>`;
  });
  // 峰值标注
  const peak = pts.reduce((a, p, i) => (p.value > a.value ? { ...p, i } : a), { value: -Infinity, i: 0 });
  g += `<text x="${x(peak.i)}" y="${y(peak.value) - 12}" text-anchor="middle" font-size="12" font-weight="700" fill="${PALETTE[0]}">${peak.value}</text>`;
  if (opts.unit) g += `<text x="${pad.l}" y="14" font-size="11" fill="${AXIS}">${esc(opts.unit)}</text>`;
  return svgWrap(w, h, g, 'chart-line');
}

/* ───────── 纵向柱状图 ───────── */
function barChart(data, opts = {}) {
  const w = 760, h = 320, pad = { t: 28, r: 20, b: 48, l: 48 };
  const pts = data.map((d) => ({ label: d.label, value: num(d.value) }));
  if (!pts.length) return svgWrap(w, h, '');
  const max = Math.max(...pts.map((p) => p.value)) * 1.18 || 1;
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const bw = (iw / pts.length) * 0.6;
  const gap = (iw / pts.length) * 0.4;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const yy = pad.t + ih - (ih / 4) * i;
    g += `<line x1="${pad.l}" y1="${yy}" x2="${w - pad.r}" y2="${yy}" stroke="${GRID}"/>`;
    g += `<text x="${pad.l - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${AXIS}">${Math.round((max / 4) * i)}</text>`;
  }
  pts.forEach((p, i) => {
    const bh = (p.value / max) * ih;
    const xx = pad.l + gap / 2 + i * (bw + gap);
    const yy = pad.t + ih - bh;
    const color = opts.color || PALETTE[i % PALETTE.length];
    g += `<rect x="${xx}" y="${yy}" width="${bw}" height="${bh}" rx="4" fill="${color}"/>`;
    g += `<text x="${xx + bw / 2}" y="${yy - 7}" text-anchor="middle" font-size="12" font-weight="700" fill="${INK}">${p.value}${opts.suffix || ''}</text>`;
    g += `<text x="${xx + bw / 2}" y="${h - pad.b + 20}" text-anchor="middle" font-size="11.5" fill="${AXIS}">${esc(p.label)}</text>`;
  });
  return svgWrap(w, h, g, 'chart-bar');
}

/* ───────── 横向条形图（排名等） ───────── */
function hBarChart(data, opts = {}) {
  const rowH = 34, pad = { t: 14, r: 90, b: 14, l: 130 };
  const w = 760;
  const pts = data.map((d) => ({ label: d.label, value: num(d.value) }));
  const h = pad.t + pad.b + pts.length * rowH;
  const max = Math.max(...pts.map((p) => p.value), 1);
  const iw = w - pad.l - pad.r;
  let g = '';
  pts.forEach((p, i) => {
    const yy = pad.t + i * rowH + 5;
    const bw = (p.value / max) * iw;
    const color = opts.color || PALETTE[i % PALETTE.length];
    g += `<text x="${pad.l - 10}" y="${yy + rowH / 2 - 2}" text-anchor="end" font-size="12.5" fill="${INK}">${esc(p.label)}</text>`;
    g += `<rect x="${pad.l}" y="${yy}" width="${Math.max(bw, 2)}" height="${rowH - 12}" rx="4" fill="${color}"/>`;
    g += `<text x="${pad.l + bw + 8}" y="${yy + rowH / 2 - 2}" font-size="12" font-weight="700" fill="${INK}">${opts.fmt ? opts.fmt(p.value) : p.value}</text>`;
  });
  return svgWrap(w, h, g, 'chart-hbar');
}

/* ───────── 环形图（细分占比） ───────── */
function donutChart(data, opts = {}) {
  const w = 360, h = 320, cx = 150, cy = 160, r = 110, ir = 64;
  const pts = data.map((d) => ({ label: d.label, value: num(d.value) }));
  const total = pts.reduce((s, p) => s + p.value, 0) || 1;
  let a0 = -Math.PI / 2, g = '';
  pts.forEach((p, i) => {
    const a1 = a0 + (p.value / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const xi0 = cx + ir * Math.cos(a1), yi0 = cy + ir * Math.sin(a1);
    const xi1 = cx + ir * Math.cos(a0), yi1 = cy + ir * Math.sin(a0);
    const color = PALETTE[i % PALETTE.length];
    g += `<path d="M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${xi0},${yi0} A${ir},${ir} 0 ${large} 0 ${xi1},${yi1} Z" fill="${color}"/>`;
    a0 = a1;
  });
  g += `<text x="${cx}" y="${cy - 6}" text-anchor="middle" font-size="13" fill="${AXIS}">${esc(opts.centerLabel || '细分')}</text>`;
  g += `<text x="${cx}" y="${cy + 18}" text-anchor="middle" font-size="20" font-weight="800" fill="${INK}">${esc(opts.centerValue || pts.length + ' 类')}</text>`;
  // 图例
  let ly = 40;
  pts.forEach((p, i) => {
    g += `<rect x="300" y="${ly - 11}" width="13" height="13" rx="3" fill="${PALETTE[i % PALETTE.length]}"/>`;
    g += `<text x="320" y="${ly}" font-size="12.5" fill="${INK}">${esc(p.label)} ${((p.value / total) * 100).toFixed(1)}%</text>`;
    ly += 26;
  });
  return svgWrap(720, h, `<g>${g}</g>`, 'chart-donut');
}

/* ───────── 雷达图（产品力 7 维对比） ───────── */
function radarChart(dims, series, opts = {}) {
  const w = 720, h = 380, cx = 210, cy = 190, R = 140, max = opts.max || 5;
  const n = dims.length;
  const ang = (i) => -Math.PI / 2 + (i / n) * Math.PI * 2;
  const pt = (i, v) => [cx + (R * v) / max * Math.cos(ang(i)), cy + (R * v) / max * Math.sin(ang(i))];
  let g = '';
  // 同心网格
  for (let ring = 1; ring <= 4; ring++) {
    const rr = (R / 4) * ring;
    const poly = dims.map((_, i) => `${cx + rr * Math.cos(ang(i))},${cy + rr * Math.sin(ang(i))}`).join(' ');
    g += `<polygon points="${poly}" fill="none" stroke="${GRID}" stroke-width="1"/>`;
  }
  // 轴线 + 维度标签
  dims.forEach((d, i) => {
    const [ex, ey] = pt(i, max);
    g += `<line x1="${cx}" y1="${cy}" x2="${ex}" y2="${ey}" stroke="${GRID}"/>`;
    const lx = cx + (R + 22) * Math.cos(ang(i));
    const ly = cy + (R + 22) * Math.sin(ang(i));
    const anchor = Math.abs(lx - cx) < 12 ? 'middle' : lx > cx ? 'start' : 'end';
    g += `<text x="${lx}" y="${ly + 4}" text-anchor="${anchor}" font-size="12.5" font-weight="600" fill="${INK}">${esc(d)}</text>`;
  });
  // 各系列多边形
  series.forEach((s, si) => {
    const color = s.color || PALETTE[si % PALETTE.length];
    const poly = s.values.map((v, i) => pt(i, num(v)).join(',')).join(' ');
    const isSelf = si === 0;
    g += `<polygon points="${poly}" fill="${color}" fill-opacity="${isSelf ? 0.22 : 0.06}" stroke="${color}" stroke-width="${isSelf ? 3 : 1.6}"/>`;
    if (isSelf) s.values.forEach((v, i) => { const [px, py] = pt(i, num(v)); g += `<circle cx="${px}" cy="${py}" r="3.5" fill="${color}"/>`; });
  });
  // 图例
  let ly = 70;
  series.forEach((s, si) => {
    const color = s.color || PALETTE[si % PALETTE.length];
    g += `<rect x="450" y="${ly - 11}" width="14" height="14" rx="3" fill="${color}" fill-opacity="${si === 0 ? 0.9 : 0.5}" stroke="${color}" stroke-width="1.5"/>`;
    g += `<text x="472" y="${ly}" font-size="12.5" fill="${INK}">${esc(s.name)}${s.score != null ? `　<tspan font-weight="700">${s.score}</tspan>` : ''}</text>`;
    ly += 28;
  });
  return svgWrap(w, h, g, 'chart-radar');
}

/* ───────── 甘特图（项目计划） ───────── */
function ganttChart(milestones, totalWeeks) {
  const rowH = 38, pad = { t: 40, r: 24, b: 16, l: 150 };
  const w = 760;
  const h = pad.t + pad.b + milestones.length * rowH;
  const iw = w - pad.l - pad.r;
  const cw = iw / totalWeeks;
  let g = '';
  // 周刻度
  for (let wk = 0; wk <= totalWeeks; wk += 4) {
    const xx = pad.l + wk * cw;
    g += `<line x1="${xx}" y1="${pad.t - 8}" x2="${xx}" y2="${h - pad.b}" stroke="${GRID}"/>`;
    g += `<text x="${xx}" y="${pad.t - 14}" text-anchor="middle" font-size="11" fill="${AXIS}">W${wk}</text>`;
  }
  milestones.forEach((m, i) => {
    const yy = pad.t + i * rowH + 6;
    const xx = pad.l + (m.start - 1) * cw;
    const bw = Math.max((m.end - m.start + 1) * cw, 6);
    const color = PALETTE[i % PALETTE.length];
    g += `<text x="${pad.l - 12}" y="${yy + 16}" text-anchor="end" font-size="12" fill="${INK}">${esc(m.phase)}</text>`;
    g += `<rect x="${xx}" y="${yy}" width="${bw}" height="${rowH - 16}" rx="5" fill="${color}" fill-opacity="0.88"/>`;
    g += `<text x="${xx + bw + 6}" y="${yy + 16}" font-size="10.5" fill="${AXIS}">${esc(m.owner)}</text>`;
  });
  return svgWrap(w, h, g, 'chart-gantt');
}

/* ───────── 半圆仪表盘（评分 / ROI） ───────── */
function gauge(value, max, opts = {}) {
  const w = 240, h = 150, cx = 120, cy = 130, r = 96;
  const pct = Math.max(0, Math.min(1, value / max));
  const a = Math.PI * (1 - pct);
  const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  const arc = (sx, sy, ex, ey, large) => `M${sx},${sy} A${r},${r} 0 ${large} 1 ${ex},${ey}`;
  const color = opts.color || (pct >= 0.8 ? PALETTE[2] : pct >= 0.6 ? PALETTE[0] : PALETTE[3]);
  let g = '';
  g += `<path d="${arc(cx - r, cy, cx + r, cy, 1)}" fill="none" stroke="${GRID}" stroke-width="16" stroke-linecap="round"/>`;
  g += `<path d="${arc(cx - r, cy, x, y, pct > 0.5 ? 1 : 0)}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round"/>`;
  g += `<text x="${cx}" y="${cy - 12}" text-anchor="middle" font-size="30" font-weight="800" fill="${INK}">${opts.display ?? value}</text>`;
  g += `<text x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="12.5" fill="${AXIS}">${esc(opts.label || '')}</text>`;
  return svgWrap(w, h, g, 'chart-gauge');
}


/* ===== js/store.js ===== */
// store.js — 状态管理 + 数据存档系统
// 当前工作数据自动保存到 localStorage；可保存为命名快照、恢复、删除、导出/导入 JSON。


const KEY_CURRENT = 'amico-lxb:current:v1';
const KEY_ARCHIVES = 'amico-lxb:archives:v1';

const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
function writeJSON(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
    return true;
  } catch (e) {
    console.warn('存储失败', e);
    return false;
  }
}

class Store {
  constructor() {
    const stored = readJSON(KEY_CURRENT, null);
    this.state = stored || buildDefaultData();
    this.archives = readJSON(KEY_ARCHIVES, []);
    this._subs = new Set();
    if (!stored) this.persist(); // 首次加载即落盘默认数据，保证当前数据始终可导出/恢复
  }

  /* ── 订阅 / 渲染 ── */
  subscribe(fn) { this._subs.add(fn); return () => this._subs.delete(fn); }
  emit() { this._subs.forEach((fn) => fn(this.state)); }

  /* ── 当前数据自动保存 ── */
  persist() { writeJSON(KEY_CURRENT, this.state); }

  /** 按点路径更新字段，如 set('meta.brand', 'Amico') */
  set(path, value) {
    const keys = path.split('.');
    let o = this.state;
    for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    o[keys[keys.length - 1]] = value;
    this.persist();
    this.emit();
  }

  get(path) {
    return path.split('.').reduce((o, k) => (o == null ? o : o[k]), this.state);
  }

  /* ── 存档（快照）管理 ── */
  saveArchive(name, note = '') {
    const snap = {
      id: uid(),
      name: name || `存档 ${this.archives.length + 1}`,
      note,
      time: new Date().toISOString(),
      schema: SCHEMA_VERSION,
      data: clone(this.state),
    };
    this.archives.unshift(snap);
    writeJSON(KEY_ARCHIVES, this.archives);
    return snap;
  }

  listArchives() { return this.archives; }

  restoreArchive(id) {
    const snap = this.archives.find((a) => a.id === id);
    if (!snap) return false;
    this.state = clone(snap.data);
    this.persist();
    this.emit();
    return true;
  }

  deleteArchive(id) {
    this.archives = this.archives.filter((a) => a.id !== id);
    writeJSON(KEY_ARCHIVES, this.archives);
  }

  renameArchive(id, name) {
    const snap = this.archives.find((a) => a.id === id);
    if (snap) { snap.name = name; writeJSON(KEY_ARCHIVES, this.archives); }
  }

  /* ── 重置 ── */
  resetToDefault() {
    this.state = buildDefaultData();
    this.persist();
    this.emit();
  }

  /* ── 导出 / 导入 ── */
  exportCurrent() {
    return JSON.stringify(
      { type: 'amico-lxb-report', schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), data: this.state },
      null, 2,
    );
  }

  exportAll() {
    return JSON.stringify(
      { type: 'amico-lxb-bundle', schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), current: this.state, archives: this.archives },
      null, 2,
    );
  }

  /** 导入：支持单报告(data) 或 整包(current+archives)。返回 {ok, msg} */
  importJSON(text) {
    let obj;
    try { obj = JSON.parse(text); } catch { return { ok: false, msg: 'JSON 解析失败，文件格式不正确' }; }
    if (obj.type === 'amico-lxb-bundle') {
      if (obj.current) this.state = obj.current;
      if (Array.isArray(obj.archives)) { this.archives = obj.archives; writeJSON(KEY_ARCHIVES, this.archives); }
    } else if (obj.data) {
      this.state = obj.data;
    } else if (obj.meta) {
      this.state = obj; // 裸数据对象
    } else {
      return { ok: false, msg: '无法识别的文件结构（缺少 data / meta 字段）' };
    }
    this.persist();
    this.emit();
    return { ok: true, msg: '导入成功' };
  }
}

const e = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmtWan = (v) => `$${(+v).toLocaleString()}万`;
const stars = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);

/* ── 可编辑文本 ── */
function ed(path, value, cls = '') {
  return `<span class="editable ${cls}" data-path="${path}" tabindex="0" title="点击编辑">${e(value)}</span>`;
}

/* ── 幻灯片头部（Action Title = 结论句） ── */
function head(ch, action, sub = '') {
  const c = CHAPTERS.find((x) => x.n === ch);
  return `<div class="slide-head">
    <div class="slide-kicker"><span class="kdot">${c.icon}</span> 第 ${ch} 章 · ${c.name}</div>
    <h2 class="action-title">${action}</h2>
    ${sub ? `<p class="slide-sub">${sub}</p>` : ''}
  </div>`;
}

/* ── KPI 卡片组 ── */
function kpiCards(items) {
  return `<div class="kpi-grid">${items.map((k) => `
    <div class="kpi-card">
      <div class="kpi-label">${e(k.label)}</div>
      <div class="kpi-value">${e(k.value)}<span class="kpi-unit">${e(k.unit || '')}</span></div>
      <div class="kpi-sub">${e(k.sub || '')}</div>
    </div>`).join('')}</div>`;
}

/* ── 通用表格 ── */
function table(cols, rows, opts = {}) {
  const align = opts.align || [];
  return `<table class="data-table ${opts.cls || ''}">
    <thead><tr>${cols.map((c, i) => `<th style="text-align:${align[i] || 'left'}">${e(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((cell, i) => `<td style="text-align:${align[i] || 'left'}">${cell}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}

/* ── 热力矩阵表（竞品参数 / 价格段覆盖） ── */
function heatTable(cols, rows) {
  const allVals = rows.flatMap((r) => r.d);
  const max = Math.max(...allVals, 1);
  const body = rows.map((r) => `<tr>
    <td class="ht-brand">${e(r.brand)}</td>
    ${r.d.map((v) => {
      const t = v / max;
      const bg = `rgba(200,134,26,${(0.10 + t * 0.62).toFixed(2)})`;
      return `<td class="ht-cell" style="background:${bg};color:${t > 0.55 ? '#fff' : '#2a2318'}">${v}</td>`;
    }).join('')}
  </tr>`).join('');
  return `<table class="data-table heat-table">
    <thead><tr><th>品牌 \\ 维度</th>${cols.map((c) => `<th style="text-align:center">${e(c)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table>`;
}

/* ── 决策节点（人工确认门） ── */
function gate(key, title, desc, valueLabel, gateState) {
  const ok = gateState.status === 'confirmed';
  return `<div class="gate ${ok ? 'gate-ok' : 'gate-wait'}" data-gate="${key}">
    <div class="gate-top">
      <span class="gate-icon">${ok ? '✔' : '⏳'}</span>
      <span class="gate-title">${e(title)}</span>
      <span class="gate-pill">${ok ? '已确认' : '等待确认'}</span>
    </div>
    <p class="gate-desc">${desc}</p>
    <div class="gate-value">确认结果：<strong>${ed(`meta.gates.${key}.value`, gateState.value)}</strong>${gateState.assist ? ` ｜ 辅助：${ed(`meta.gates.${key}.assist`, gateState.assist)}` : ''} <span class="gate-time">${e(gateState.time || '')}</span></div>
  </div>`;
}

function chip(text, kind = '') { return `<span class="chip ${kind}">${e(text)}</span>`; }

      { name: d.benchNames[1], values: d.radar.map((r) => r.c1), score: d.benchScore[1], color: PALETTE[1] },
      { name: d.benchNames[2], values: d.radar.map((r) => r.c2), score: d.benchScore[2], color: PALETTE[4] },
      { name: d.benchNames[3], values: d.radar.map((r) => r.c3), score: d.benchScore[3], color: PALETTE[5] },
    ];
    push(6, `${head(6, `方向 ${d.id}：${e(d.name)} — 雷达综合均分 ${d.score}（对标 ${d.benchScore.slice(1).join('/')}）`, `${d.rec} · <span class="stars">${stars(d.stars)}</span>`)}
      <div class="two-col">
        <div>
          ${table(['定义维度', '内容'], [
            ['目标价格段', `<strong>${e(d.price)}</strong>（目标 $${d.target}）`],
            ['核心参数', e(d.params)],
            ['用户类型', e(d.userType)],
            ['目标用户', e(d.users)],
            ['差异化卖点', `<strong>${e(d.selling)}</strong>`],
            ['与己品关联', e(d.link)],
            ['预期月销量', `${d.expSales} 件`],
          ])}
        </div>
        <div>${radarChart(d.radar.map((r) => r.dim), series)}</div>
      </div>`);
  });

  const A = pd.directions[0];
  push(6, `${head(6, `已确认方向 A，生成双 SKU 产品定义表，专利风险评估为${e(pd.patent.risk)}`, '产品方向选择 — 等待人工确认')}
    ${gate('direction', '产品方向确认', '确认后「定策略 / 定计划 / 立项评审」均围绕该方向展开，财务与风险与之绑定。', 'A', s.meta.gates.direction)}
    <div class="two-col" style="margin-top:14px">
      <div><h4 class="blk-title">产品定义表（方向 A 双 SKU）</h4>
        ${table(pd.defTable.cols, pd.defTable.rows.map((r) => r.map((c, i) => i === 0 ? `<strong>${e(c)}</strong>` : e(c))), { cls: 'compact' })}</div>
      <div><h4 class="blk-title">专利排查与风险分析</h4>
        <div class="patent-row"><span>外观专利</span>${e(pd.patent.appearance)}</div>
        <div class="patent-row"><span>发明专利</span>${e(pd.patent.invention)}</div>
        <div class="patent-row"><span>风险等级</span>${chip(pd.patent.risk, 'good')}</div>
        <div class="patent-row"><span>行动计划</span>${e(pd.patent.action)}</div>
        <div class="callout sm" style="margin-top:12px">🎯 核心卖点：${e(A.selling)} ｜ ${e(A.params)}</div>
      </div>
    </div>`);

  /* ═══ 第 7 章 定策略 ═══ */
  const st = s.strategy;
  const totalCost = st.costRows.reduce((a, c) => a + c.value, 0);
  push(7, `${head(7, `方向 A 售价 $${st.price}，毛利率 ${st.grossMargin}%，首年 ROI ${st.roi.roiPct}%，${st.roi.payback} 月回本`)}
    <div class="three-col">
      <div><h4 class="blk-title">单件成本结构（$）</h4>
        ${table(['成本项', '金额', '说明'], st.costRows.map((c) => [e(c.item), '$' + c.value, e(c.note)]), { align: ['left', 'right', 'left'] })}
        <div class="cost-sum">总成本 $${totalCost.toFixed(1)} ｜ 单件毛利 <strong>$${(st.price - totalCost).toFixed(1)}</strong></div>
      </div>
      <div class="center-col">
        ${gauge(st.grossMargin, 100, { display: st.grossMargin + '%', label: '毛利率', color: PALETTE[2] })}
        ${gauge(st.roi.roiPct, 200, { display: st.roi.roiPct + '%', label: '首年 ROI', color: PALETTE[0] })}
      </div>
      <div><h4 class="blk-title">盈亏平衡 & 首年测算</h4>
        ${table(['指标', '值'], [
          ['固定投入', `$${st.breakeven.fixedInvest}万`],
          ['盈亏平衡月销量', `<strong>${st.breakeven.monthlyUnit} 件</strong>`],
          ['月销目标', `${st.roi.monthlyTarget} 件`],
          ['单件净利', `$${st.roi.unitProfit}`],
          ['首年销量', `${st.roi.year1Sales.toLocaleString()} 件`],
          ['首年销额', `$${st.roi.year1Revenue}万`],
          ['首年净利', `<strong>$${st.roi.year1Profit}万</strong>`],
          ['回本周期', `${st.roi.payback} 月`],
        ], { align: ['left', 'right'] })}
        <div class="callout sm">${e(st.breakeven.note)}</div>
      </div>
    </div>`);

  /* ═══ 第 8 章 定计划 ═══ */
  const tl = s.timeline;
  push(8, `${head(8, `方向 A 开发周期 ${tl.totalWeeks} 周：开模→认证→量产→上架→推广爬升`)}
    ${ganttChart(tl.milestones, tl.totalWeeks)}
    <div class="note-row">
      ${chip('关键路径：开模(W3) → 认证(W10) → 量产(W13) → 上架(W17)', 'good')}
      ${chip('认证 ETL/HVI 与 DVT 并行以压缩周期')}
    </div>`);

  /* ═══ 第 9 章 立项评审 ═══ */
  const ap = s.approval;
  push(9, `${head(9, '立项九问全部正向，9 项均分 4.3 / 5，无致命短板')}
    <div class="nine-grid">${ap.nineQuestions.map((q, i) => `
      <div class="nine-card">
        <div class="nine-q"><span class="nine-n">Q${i + 1}</span>${e(q.q)}</div>
        <div class="nine-a">${e(q.a)}</div>
        <div class="nine-score">${'●'.repeat(q.score)}${'○'.repeat(5 - q.score)} <b>${q.score}</b></div>
      </div>`).join('')}</div>`);

  const weighted = ap.scoreMatrix.reduce((a, m) => a + (m.weight / 100) * m.score, 0);
  push(9, `${head(9, `加权综合得分 ${weighted.toFixed(2)} / 5 ≥ Go 阈值 4.0 → 决策【${ap.decision}】`, '立项决策矩阵')}
    <div class="two-col">
      <div>${table(['评估维度', '权重', '得分', '加权'], ap.scoreMatrix.map((m) => [
        `<strong>${e(m.dim)}</strong>`, m.weight + '%', m.score.toFixed(1),
        `<div class="mini-bar"><div style="width:${(m.score / 5) * 100}%"></div></div>`,
      ]), { align: ['left', 'center', 'center', 'left'] })}
        <div class="cost-sum">加权总分 <strong>${weighted.toFixed(2)} / 5</strong></div>
      </div>
      <div class="decision-col">
        <div class="decision-badge ${ap.decision === 'Go' ? 'go' : 'nogo'}">${e(ap.decision)}</div>
        <p class="decision-note">${e(ap.decisionNote)}</p>
      </div>
    </div>`);

  return slides;
}


/* ===== js/main.js ===== */
// main.js — 控制器：视图切换、键盘导航、字段编辑、决策门、数据存档抽屉、PDF 导出

const DESIGN_W = 1280, DESIGN_H = 720;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

let view = 'board';   // 'board' | 'deck'
let idx = 0;          // 当前幻灯片索引（演示模式），0 = 封面
let slides = [];

const stage = $('#stage');
const side = $('#side');

/* ───────── 渲染入口 ───────── */
function render() {
  slides = buildSlides(store.state);
  idx = Math.max(0, Math.min(idx, slides.length - 1));
  $('#tbSub').textContent = `${store.state.meta.category} · ${store.state.meta.brand}`;
  $$('.seg-btn').forEach((b) => b.classList.toggle('is-on', b.dataset.view === view));
  renderSide();
  view === 'board' ? renderBoard() : renderDeck();
}

/* 把幻灯片 HTML 包进固定 1280×720 画布 */
function canvas(html) {
  return `<div class="slide-frame"><div class="slide-canvas">${html}</div></div>`;
}

/* 缩放画布以适配容器宽度 */
function fitFrames(root = document) {
  $$('.slide-frame', root).forEach((frame) => {
    const w = frame.clientWidth;
    const s = w / DESIGN_W;
    const cv = frame.firstElementChild;
    cv.style.transform = `scale(${s})`;
    frame.style.height = `${DESIGN_H * s}px`;
  });
}

/* ── 看板视图：全部幻灯片缩略图，按章分组 ── */
function renderBoard() {
  const groups = new Map();
  slides.forEach((sl, i) => {
    const key = sl.cover ? 0 : sl.ch;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ sl, i });
  });
  let html = '';
  for (const [ch, items] of groups) {
    const c = CHAPTERS.find((x) => x.n === ch);
    const label = ch === 0 ? '封面 · 工作流总览' : `${c.icon} 第 ${ch} 章 · ${c.name}`;
    html += `<div class="board-group"><div class="board-group-title">${label} <span>${items.length} 页</span></div>
      <div class="board-grid">${items.map(({ sl, i }) => `
        <button class="thumb" data-goto="${i}" aria-label="第 ${i + 1} 页">
          ${canvas(sl.body)}
          <span class="thumb-no">${i + 1}</span>
        </button>`).join('')}</div></div>`;
  }
  stage.className = 'stage stage-board';
  stage.innerHTML = html;
  fitFrames(stage);
}

/* ── 演示视图：单页大图 + 控制 ── */
function renderDeck() {
  const sl = slides[idx];
  stage.className = 'stage stage-deck';
  stage.innerHTML = `
    <div class="deck-wrap">
      <div class="deck-stage">${canvas(sl.body)}</div>
      <div class="deck-bar">
        <button class="nav-btn" data-nav="-1" ${idx === 0 ? 'disabled' : ''}>‹ 上一页</button>
        <span class="deck-count">${idx + 1} / ${slides.length}</span>
        <button class="nav-btn" data-nav="1" ${idx === slides.length - 1 ? 'disabled' : ''}>下一页 ›</button>
      </div>
    </div>`;
  fitFrames(stage);
}

/* ── 侧栏：章节大纲 ── */
function renderSide() {
  let html = '<div class="side-head">章节大纲</div>';
  let lastCh = null;
  slides.forEach((sl, i) => {
    const ch = sl.cover ? 0 : sl.ch;
    if (ch !== lastCh) {
      const c = CHAPTERS.find((x) => x.n === ch);
      html += `<div class="side-ch">${ch === 0 ? '◆ 封面 / 总览' : `${c.icon} ${ch}. ${c.name}`}</div>`;
      lastCh = ch;
    }
    const title = sl.cover ? '封面' : (sl.body.match(/action-title">(.*?)<\/h2>/)?.[1] || `第 ${i + 1} 页`).replace(/<[^>]+>/g, '');
    html += `<button class="side-item ${i === idx && view === 'deck' ? 'is-cur' : ''}" data-goto="${i}">
      <span class="side-no">${i + 1}</span><span class="side-t">${title}</span></button>`;
  });
  side.innerHTML = html;
}

/* ───────── 导航 ───────── */
function goto(i, toDeck = true) {
  idx = Math.max(0, Math.min(i, slides.length - 1));
  if (toDeck) view = 'deck';
  render();
}
function nav(d) { goto(idx + d); }

/* ───────── 字段编辑（contenteditable） ───────── */
function startEdit(el) {
  if (el.isContentEditable) return;
  el.contentEditable = 'true';
  el.classList.add('editing');
  const r = document.createRange();
  r.selectNodeContents(el);
  const sel = getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  el.focus();
  const commit = () => {
    el.contentEditable = 'false';
    el.classList.remove('editing');
    const path = el.dataset.path;
    const val = el.textContent.trim();
    el.removeEventListener('blur', commit);
    el.removeEventListener('keydown', onKey);
    if (store.get(path) !== val) { store.set(path, val); toast('已更新并自动存档'); }
    else render();
  };
  const onKey = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); el.blur(); }
    if (ev.key === 'Escape') { el.textContent = store.get(el.dataset.path); el.blur(); }
  };
  el.addEventListener('blur', commit);
  el.addEventListener('keydown', onKey);
}

/* ───────── 决策门切换 ───────── */
function toggleGate(key) {
  const g = store.state.meta.gates[key];
  g.status = g.status === 'confirmed' ? 'wait' : 'confirmed';
  if (g.status === 'confirmed') g.time = new Date().toISOString().slice(0, 10);
  store.persist(); render();
  toast(g.status === 'confirmed' ? '决策门已确认 ✔' : '决策门改为等待确认');
}

/* ───────── 数据存档抽屉 ───────── */
function openDrawer() { $('#drawer').hidden = false; $('#mask').hidden = false; renderArchives(); }
function closeDrawer() { $('#drawer').hidden = true; $('#mask').hidden = true; }

function renderArchives() {
  const list = store.listArchives();
  $('#arCount').textContent = list.length;
  $('#arList').innerHTML = list.length ? list.map((a) => `
    <div class="ar-item" data-id="${a.id}">
      <div class="ar-main">
        <div class="ar-name">${escapeHtml(a.name)}</div>
        <div class="ar-meta">${new Date(a.time).toLocaleString('zh-CN')}${a.note ? ' · ' + escapeHtml(a.note) : ''}</div>
      </div>
      <div class="ar-acts">
        <button class="mini" data-ar="restore" title="恢复">恢复</button>
        <button class="mini" data-ar="rename" title="重命名">✎</button>
        <button class="mini danger" data-ar="delete" title="删除">🗑</button>
      </div>
    </div>`).join('') : '<p class="dw-empty">暂无存档。修改数据后点上方「保存快照」即可归档。</p>';
}

/* ───────── 文件下载 / 导入 ───────── */
function download(filename, text) {
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const slug = () => (store.state.meta.brand || 'report').replace(/\s+/g, '-') + '-立项-' + new Date().toISOString().slice(0, 10);

/* ───────── PDF 导出（浏览器打印） ───────── */
function exportPDF() {
  const root = $('#printRoot');
  root.innerHTML = slides.map((sl) => `<div class="print-page"><div class="slide-canvas">${sl.body}</div></div>`).join('');
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); root.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 60);
}

/* ───────── Toast ───────── */
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.remove('show'); setTimeout(() => (t.hidden = true), 250); }, 1900);
}
const escapeHtml = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* ───────── 事件委托 ───────── */
document.addEventListener('click', (ev) => {
  const t = ev.target;
  const goEl = t.closest('[data-goto]');
  if (goEl) { goto(+goEl.dataset.goto); return; }

  const viewBtn = t.closest('[data-view]');
  if (viewBtn) { view = viewBtn.dataset.view; render(); return; }

  const navBtn = t.closest('[data-nav]');
  if (navBtn) { nav(+navBtn.dataset.nav); return; }

  const editEl = t.closest('.editable');
  if (editEl) { startEdit(editEl); return; }

  const gatePill = t.closest('.gate .gate-pill');
  if (gatePill) { toggleGate(gatePill.closest('[data-gate]').dataset.gate); return; }

  const arItem = t.closest('[data-ar]');
  if (arItem) { handleArchiveAction(arItem); return; }

  const act = t.closest('[data-act]')?.dataset.act;
  if (act) handleAct(act);
});

function handleArchiveAction(btn) {
  const id = btn.closest('.ar-item').dataset.id;
  const kind = btn.dataset.ar;
  if (kind === 'restore') { store.restoreArchive(id); closeDrawer(); toast('已恢复该存档'); }
  else if (kind === 'delete') { if (confirm('确认删除该存档？')) { store.deleteArchive(id); renderArchives(); } }
  else if (kind === 'rename') {
    const cur = store.listArchives().find((a) => a.id === id);
    const name = prompt('重命名存档', cur?.name || '');
    if (name) { store.renameArchive(id, name.trim()); renderArchives(); }
  }
}

function handleAct(act) {
  switch (act) {
    case 'archive': openDrawer(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'print': exportPDF(); break;
    case 'save-snap': {
      const name = $('#snapName').value.trim();
      const note = $('#snapNote').value.trim();
      store.saveArchive(name, note);
      $('#snapName').value = ''; $('#snapNote').value = '';
      renderArchives(); toast('快照已保存 ✔');
      break;
    }
    case 'export-current': download(slug() + '.json', store.exportCurrent()); toast('已导出当前报告'); break;
    case 'export-bundle': download(slug() + '-整包.json', store.exportAll()); toast('已导出整包（含存档）'); break;
    case 'import': $('#fileInput').click(); break;
    case 'reset':
      if (confirm('恢复为默认示例数据？当前未存档的修改将丢失（已保存的快照不受影响）。')) { store.resetToDefault(); toast('已恢复默认数据'); }
      break;
  }
}

$('#fileInput').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const res = store.importJSON(reader.result);
    toast(res.msg);
    if (res.ok) closeDrawer();
  };
  reader.readAsText(file);
  ev.target.value = '';
});

$('#mask').addEventListener('click', closeDrawer);

/* 键盘导航 */
document.addEventListener('keydown', (ev) => {
  if (document.activeElement?.isContentEditable) return;
  if (!$('#drawer').hidden) { if (ev.key === 'Escape') closeDrawer(); return; }
  if (view === 'deck') {
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); nav(1); }
    if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); nav(-1); }
    if (ev.key === 'Escape') { view = 'board'; render(); }
  } else if (ev.key === 'Enter' || ev.key === 'ArrowRight') {
    view = 'deck'; render();
  }
});

window.addEventListener('resize', () => fitFrames());
store.subscribe(() => { render(); if (!$('#drawer').hidden) renderArchives(); });

render();

</script>
